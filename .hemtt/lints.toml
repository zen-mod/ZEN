[sqf.banned_commands]
options.ignore = [
    "addPublicVariableEventHandler", # Alt syntax is broken, we are using main syntax
]

[sqf.var_all_caps]
options.ignore = [
    # Debug macros
    "ZEN_COUNTERS",
    "ZEN_PFH_COUNTER",
    "ZEN_PREP_RECOMPILE",
    "ZEN_RECOMPILES",

    # External variables
    "AR_SUPPORTED_VEHICLES"
]

# Arma supports JPEGs for UI pictures, such as the screenshots used by tour pages
[config.file_type]
enabled = false
